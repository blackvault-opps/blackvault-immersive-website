<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BlackVault — Beyond Games. Beyond Reality.</title>
<link rel="icon" type="image/png" href="/assets/blackvault-round-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --purple: #6f19ff;
  --ink: #15121b;
  --muted: #716b7a;
  --glass: rgba(255,255,255,.82);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, system-ui, sans-serif;
  color: var(--ink);
}

body {
  min-height: 100svh;
  overflow-x: hidden;
  background: radial-gradient(circle at 50% 42%, rgba(111,25,255,.10), transparent 28%),
              linear-gradient(#fff 0 76%, #fbf8ff 100%);
}

button { font: inherit; cursor: pointer; }

/* === HEADER === */
.entry-header {
  position: fixed;
  z-index: 30;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: min(94vw, 1180px);
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 10px 9px 18px;
  border: 1px solid rgba(111,25,255,.10);
  border-radius: 22px;
  background: rgba(255,255,255,.86);
  box-shadow: 0 18px 45px rgba(73,14,145,.10);
  backdrop-filter: blur(18px);
}

.brand-logo {
  display: block;
  width: min(200px, 38vw);
  height: auto;
  object-fit: contain;
  object-position: left center;
}

.account-actions {
  display: flex;
  gap: 8px;
}

.button {
  min-height: 54px;
  padding: 0 24px;
  border-radius: 15px;
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: 800;
  transition: .18s ease;
}

.button:hover { transform: translateY(-2px); }

.button.small {
  min-height: 42px;
  padding: 0 16px;
  border-radius: 13px;
  font-size: .86rem;
}

.button.purple {
  color: #fff;
  background: linear-gradient(135deg, #923cff, #5c0bdc);
  box-shadow: 0 12px 28px rgba(111,25,255,.25), 0 0 28px rgba(111,25,255,.10);
}

.button.glass {
  color: #5d12d9;
  border: 1px solid rgba(111,25,255,.40);
  background: rgba(255,255,255,.74);
  box-shadow: 0 10px 28px rgba(62,15,120,.07), inset 0 1px 0 rgba(255,255,255,.96);
  backdrop-filter: blur(14px);
}

/* === ENTRY PAGE === */
.entry-page {
  min-height: 100svh;
  padding: 100px 16px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.entry-card {
  width: min(1180px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 18px 30px;
  border: 1px solid rgba(111,25,255,.08);
  border-radius: 34px;
  background: rgba(255,255,255,.92);
  box-shadow: 0 22px 60px rgba(70,18,140,.12);
  overflow: visible;
  height: auto;
  min-height: 0;
  max-height: none;
}

/* === SLOGAN === */
.slogan {
  margin: 0 0 8px;
  text-align: center;
  font-size: clamp(.72rem, 1.1vw, .88rem);
  line-height: 1.8;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 700;
}

.slogan strong {
  display: block;
  font-weight: 800;
  color: var(--purple);
}

/* === HERO STAGE === */
.hero-stage {
  position: relative;
  display: block;
  width: 100%;
  max-width: 1050px;
  height: auto;
  min-height: 0;
  max-height: none;
  overflow: visible;
  margin: 0 auto;
  clip-path: none;
  mask: none;
  -webkit-mask: none;
  transform: none;
}

.hero-stage::before,
.hero-stage::after {
  display: none;
}

.hero-art {
  position: relative;
  z-index: 2;
  display: block;
  width: 100%;
  height: auto;
  min-height: 0;
  max-height: none;
  object-fit: contain;
  object-position: center center;
  overflow: visible;
  clip-path: none;
  mask: none;
  -webkit-mask: none;
  transform: none;
  opacity: 1;
  margin: 0 auto;
  pointer-events: none;
  user-select: none;
  animation: none;
  transition: none;
}

/* === ORB EFFECTS — disabled until image confirmed rendering fully === */
.orb-effects {
  display: none;
}

/* === ENTRY ACTIONS === */
.entry-actions {
  z-index: 4;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 16px;
}

.enter { position: relative; }

.enter::after {
  content: "";
  position: absolute;
  inset: -2px;
  border: 1px solid rgba(142,71,255,.52);
  border-radius: inherit;
  animation: buttonPulse 2.6s ease-out infinite;
  pointer-events: none;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 13px #fff;
  animation: dotPulse 1.8s ease-in-out infinite;
}

.age-note {
  margin: 15px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: var(--muted);
  font-size: .78rem;
}

.age-note span {
  display: inline-grid;
  place-items: center;
  min-width: 37px;
  min-height: 27px;
  padding: 0 8px;
  border-radius: 999px;
  background: #17131e;
  color: #fff;
  font-weight: 800;
}

/* === CONNECTION STATUS === */
.connection-status {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: 6%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 80%;
  font-size: .72rem;
  letter-spacing: .17em;
  font-weight: 800;
  color: var(--purple);
  text-shadow: 0 0 18px rgba(111,25,255,.22);
  opacity: 0;
  transition: .22s ease;
}

.connection-status.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
}

/* Connection state handled via JS class only */

/* === AGE DIALOG === */
.age-dialog {
  width: min(92vw, 520px);
  padding: 0;
  border: 0;
  border-radius: 28px;
  background: transparent;
}

.age-dialog::backdrop {
  background: rgba(15,8,24,.46);
  backdrop-filter: blur(10px);
}

.age-card {
  margin: 0;
  padding: 32px;
  border: 1px solid rgba(111,25,255,.16);
  border-radius: 28px;
  background: radial-gradient(circle at 82% 0%, rgba(151,75,255,.12), transparent 34%),
              rgba(255,255,255,.98);
  box-shadow: 0 34px 90px rgba(55,12,112,.24), 0 0 42px rgba(111,25,255,.10);
}

.mini-orb {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  margin-bottom: 18px;
  background: radial-gradient(circle, #fff 0 8%, #dabaff 20%, #7e25f8 48%, #281041 72%);
  box-shadow: 0 0 32px rgba(111,25,255,.34);
}

.modal-kicker {
  margin: 0 0 10px;
  color: var(--purple);
  font-size: .68rem;
  letter-spacing: .17em;
  font-weight: 800;
}

.age-card h1 {
  margin: 0;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
}

.age-card > p:not(.modal-kicker) {
  color: var(--muted);
  line-height: 1.7;
}

.modal-actions {
  display: grid;
  gap: 10px;
  margin-top: 22px;
}

/* === CURSOR AURA === */
.cursor-aura {
  position: fixed;
  z-index: 100;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  opacity: 0;
  background: radial-gradient(circle, rgba(142,76,255,.20), rgba(111,25,255,.07) 44%, transparent 72%);
  box-shadow: 0 0 24px rgba(111,25,255,.14);
}

body.cursor-live .cursor-aura { opacity: 1; }

/* === KEYFRAMES === */
@keyframes orbBreath {
  0%, 100% { transform: scale(.95); opacity: .66; }
  50% { transform: scale(1.06); opacity: 1; }
}

@keyframes ringExpand {
  0% { transform: scale(.86); opacity: 0; }
  14% { opacity: .52; }
  100% { transform: scale(1.55); opacity: 0; }
}

@keyframes connectPulse {
  0%, 100% { transform: scale(.95); opacity: .74; filter: brightness(1); }
  50% { transform: scale(1.12); opacity: 1; filter: brightness(1.25); }
}

@keyframes buttonPulse {
  0% { transform: scale(1); opacity: .62; }
  78%, 100% { transform: scale(1.12); opacity: 0; }
}

@keyframes dotPulse {
  0%, 100% { transform: scale(.82); opacity: .72; }
  50% { transform: scale(1.25); opacity: 1; }
}

/* === RESPONSIVE === */
@media (max-width: 760px) {
  .entry-header {
    top: 10px;
    min-height: 60px;
    padding: 7px 8px 7px 12px;
    border-radius: 19px;
  }

  .brand-logo { width: min(150px, 36vw); }

  .button.small {
    min-height: 39px;
    padding: 0 11px;
    font-size: .76rem;
  }

  .entry-page { padding: 84px 10px 20px; }

  .entry-card {
    padding: 16px 10px 24px;
    border-radius: 26px;
  }

  .slogan {
    font-size: .62rem;
    letter-spacing: .10em;
  }

  .hero-art { width: 100%; }
  .orb-effects { --orb: clamp(100px, 30vw, 180px); }
  .entry-actions { width: min(94%, 560px); }
  .button { flex: 1 1 200px; }
}

@media (max-width: 480px) {
  .brand-logo { width: 130px; }
  .account-actions { gap: 5px; }

  .button.small {
    padding: 0 9px;
    font-size: .70rem;
  }

  .hero-art { width: 100%; }

  .entry-actions {
    display: grid;
    width: 92%;
  }

  .button {
    width: 100%;
    min-height: 50px;
  }

  .age-note { font-size: .68rem; }

  .age-card { padding: 26px 21px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="entry-header">
  <img src="/assets/blackvault-horizontal-logo.png" alt="BlackVault" class="brand-logo"/>
  <div class="account-actions">
    <button class="button small glass" type="button">Sign In</button>
    <button class="button small purple" type="button">Sign Up</button>
  </div>
</header>

<!-- Entry Page -->
<main class="entry-page">
  <div class="entry-card">

    <!-- Slogan -->
    <p class="slogan">
      Beyond Games. Beyond Reality.<br/>
      <strong>This is BlackVault.</strong>
    </p>

    <!-- Hero Stage -->
    <div class="hero-stage" id="heroStage">
      <img
        src="/assets/blackvault-vault-echo-orb-hero.png.png"
        alt="Vault AI and Echo AI presenting the BlackVault Orb"
        class="hero-art"
        fetchpriority="high"
      />

      <!-- Orb Effects (transparent rings only — no filled sphere) -->
      <div class="orb-effects">
        <div class="orb-glow"></div>
        <div class="orb-ring ring-one"></div>
        <div class="orb-ring ring-two"></div>
      </div>

      <!-- Connection Status -->
      <div class="connection-status" id="connectionStatus"></div>
    </div>

    <!-- Entry Actions -->
    <div class="entry-actions">
      <button class="button purple enter" type="button" id="enterBlackVault">
        <span class="pulse-dot"></span>
        Enter BlackVault
      </button>
      <button class="button glass" type="button" id="initiateConnection">
        Initiate Connection
      </button>
    </div>

    <p class="age-note"><span>18+</span> Age-restricted entertainment</p>

  </div>
</main>

<!-- Age Dialog -->
<dialog class="age-dialog" id="ageDialog">
  <div class="age-card">
    <div class="mini-orb"></div>
    <p class="modal-kicker">AGE CONFIRMATION</p>
    <h1>Verify Your Age</h1>
    <p>BlackVault includes entertainment experiences intended for adult members. Please confirm that you are 18 years of age or older to continue.</p>
    <div class="modal-actions">
      <button class="button purple" type="button" id="ageConfirm" value="confirm">I Am 18+ — Enter BlackVault</button>
      <button class="button glass" type="button" id="ageExit">Exit</button>
    </div>
  </div>
</dialog>

<!-- Cursor Aura -->
<div class="cursor-aura"></div>

<script>
(function() {
  var enterButton = document.getElementById('enterBlackVault');
  var connectionButton = document.getElementById('initiateConnection');
  var status = document.getElementById('connectionStatus');
  var stage = document.getElementById('heroStage');
  var ageDialog = document.getElementById('ageDialog');
  var ageConfirm = document.getElementById('ageConfirm');
  var ageExit = document.getElementById('ageExit');
  var cursorAura = document.querySelector('.cursor-aura');

  var sleep = function(ms) { return new Promise(function(r) { setTimeout(r, ms); }); };

  function navigateToHomepage() {
    window.location.href = '/home.html';
  }

  // Connection sequence — visual only, no navigation
  async function runConnection() {
    if (connectionButton.disabled) return;
    connectionButton.disabled = true;
    stage.classList.add('is-connecting');
    status.classList.add('visible');

    var messages = ['SIGNAL DETECTED', 'CONNECTION ESTABLISHED', 'BLACKVAULT ONLINE'];
    for (var i = 0; i < messages.length; i++) {
      status.textContent = messages[i];
      await sleep(1050);
    }

    await sleep(400);
    status.classList.remove('visible');
    stage.classList.remove('is-connecting');
    connectionButton.disabled = false;
  }

  connectionButton.addEventListener('click', runConnection);

  // Enter BlackVault — requires explicit click every time
  enterButton.addEventListener('click', function() {
    var ageVerified = localStorage.getItem('blackvault_age_verified') === 'true';

    if (ageVerified) {
      navigateToHomepage();
      return;
    }

    if (typeof ageDialog.showModal === 'function') {
      ageDialog.showModal();
    }
  });

  // Age confirm — store verification then navigate
  ageConfirm.addEventListener('click', function() {
    localStorage.setItem('blackvault_age_verified', 'true');
    ageDialog.close('confirm');
    navigateToHomepage();
  });

  // Exit — close modal, stay on Entry Gate
  ageExit.addEventListener('click', function() {
    ageDialog.close('cancel');
  });

  // Cursor aura (pointer devices only)
  if (window.matchMedia('(pointer: fine)').matches) {
    var mx = -100, my = -100, ax = -100, ay = -100;
    document.body.classList.add('cursor-live');
    window.addEventListener('mousemove', function(e) { mx = e.clientX; my = e.clientY; });
    var animate = function() {
      ax += (mx - ax) * 0.15;
      ay += (my - ay) * 0.15;
      cursorAura.style.left = ax + 'px';
      cursorAura.style.top = ay + 'px';
      requestAnimationFrame(animate);
    };
    animate();
  }
})();
</script>
</body>
</html>
