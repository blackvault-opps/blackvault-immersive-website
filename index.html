<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BlackVault — Enter The Universe</title>
<link rel="icon" type="image/png" href="/assets/blackvault-round-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --purple: #6f19ff;
  --ink: #15121b;
  --muted: #716b7a;
  --glass: rgba(255,255,255,.82);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, system-ui, sans-serif;
  color: var(--ink);
}

body {
  min-height: 100svh;
  overflow-x: hidden;
  background: radial-gradient(circle at 50% 42%, rgba(111,25,255,.10), transparent 28%),
              linear-gradient(#fff 0 76%, #fbf8ff 100%);
}

button { font: inherit; cursor: pointer; }

/* === HEADER === */
.entry-header {
  position: fixed;
  z-index: 30;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: min(94vw, 1180px);
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 10px 9px 18px;
  border: 1px solid rgba(111,25,255,.10);
  border-radius: 22px;
  background: rgba(255,255,255,.86);
  box-shadow: 0 18px 45px rgba(73,14,145,.10);
  backdrop-filter: blur(18px);
}

.brand-logo {
  display: block;
  width: min(200px, 38vw);
  height: auto;
  object-fit: contain;
  object-position: left center;
}

.account-actions {
  display: flex;
  gap: 8px;
}

.button {
  min-height: 54px;
  padding: 0 24px;
  border-radius: 15px;
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: 800;
  transition: .18s ease;
}

.button:hover { transform: translateY(-2px); }

.button.small {
  min-height: 42px;
  padding: 0 16px;
  border-radius: 13px;
  font-size: .86rem;
}

.button.purple {
  color: #fff;
  background: linear-gradient(135deg, #923cff, #5c0bdc);
  box-shadow: 0 12px 28px rgba(111,25,255,.25), 0 0 28px rgba(111,25,255,.10);
}

.button.glass {
  color: #5d12d9;
  border: 1px solid rgba(111,25,255,.40);
  background: rgba(255,255,255,.74);
  box-shadow: 0 10px 28px rgba(62,15,120,.07), inset 0 1px 0 rgba(255,255,255,.96);
  backdrop-filter: blur(14px);
}

/* === ENTRY PAGE === */
.entry-page {
  min-height: 100svh;
  padding: 100px 16px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.entry-card {
  width: min(1180px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 18px 30px;
  border: 1px solid rgba(111,25,255,.08);
  border-radius: 34px;
  background: radial-gradient(circle at 50% 44%, rgba(120,39,255,.05), transparent 34%),
              rgba(255,255,255,.92);
  box-shadow: 0 22px 60px rgba(70,18,140,.12);
  overflow: visible;
}

/* === HERO HEADING === */
.hero-heading {
  margin: 0 0 4px;
  text-align: center;
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.1;
  color: var(--ink);
}

.powered-line {
  margin: 0 0 12px;
  text-align: center;
  font-size: clamp(.68rem, 1vw, .82rem);
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--muted);
}

/* === HERO STAGE === */
.hero-stage {
  position: relative;
  width: 100%;
  max-width: 1050px;
  height: auto;
  min-height: 0;
  overflow: visible;
  margin: 0 auto;
}

.hero-art {
  position: relative;
  z-index: 2;
  display: block;
  width: min(100%, 1050px);
  height: auto;
  max-height: none;
  object-fit: contain;
  object-position: center;
  margin: 0 auto;
  pointer-events: none;
  user-select: none;
}

/* === ORB EFFECTS === */
.orb-effects {
  --orb: clamp(140px, 22vw, 300px);
  position: absolute;
  z-index: 1;
  left: 50%;
  top: 50%;
  width: var(--orb);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.orb-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(111,25,255,.20);
  background: transparent;
}

.orb-glow {
  position: absolute;
  inset: -15%;
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 0 40px rgba(111,25,255,.14), 0 0 80px rgba(111,25,255,.06);
  animation: orbBreath 3.2s ease-in-out infinite;
}

.ring-one { animation: ringExpand 4.8s ease-out infinite; }
.ring-two { animation: ringExpand 4.8s 2.4s ease-out infinite; }

/* === PATH SELECTION === */
.path-heading {
  margin: 20px 0 12px;
  text-align: center;
  font-size: clamp(.68rem, 1vw, .8rem);
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--purple);
}

.path-actions {
  z-index: 4;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: min(94%, 560px);
  margin: 0 auto;
}

.path-button {
  position: relative;
  min-height: 58px;
  padding: 0 20px;
  border-radius: 16px;
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: 800;
  font-size: .92rem;
  letter-spacing: .01em;
  color: #fff;
  background: linear-gradient(135deg, #923cff, #5c0bdc);
  box-shadow: 0 12px 28px rgba(111,25,255,.22), 0 0 28px rgba(111,25,255,.08);
  transition: .18s ease;
}

.path-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(111,25,255,.30), 0 0 36px rgba(111,25,255,.12);
}

.path-button::after {
  content: "";
  position: absolute;
  inset: -2px;
  border: 1px solid rgba(142,71,255,.42);
  border-radius: inherit;
  animation: buttonPulse 2.8s ease-out infinite;
  pointer-events: none;
}

.age-note {
  margin: 18px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: var(--muted);
  font-size: .78rem;
}

.age-note span {
  display: inline-grid;
  place-items: center;
  min-width: 37px;
  min-height: 27px;
  padding: 0 8px;
  border-radius: 999px;
  background: #17131e;
  color: #fff;
  font-weight: 800;
}

/* === CONNECTION STATUS === */
.connection-status {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: 6%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 80%;
  font-size: .72rem;
  letter-spacing: .17em;
  font-weight: 800;
  color: var(--purple);
  text-shadow: 0 0 18px rgba(111,25,255,.22);
  opacity: 0;
  transition: .22s ease;
}

.connection-status.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
}

.hero-stage.is-connecting .orb-glow {
  animation: connectPulse .9s ease-in-out infinite;
}

/* === AGE DIALOG === */
.age-dialog {
  width: min(92vw, 520px);
  padding: 0;
  border: 0;
  border-radius: 28px;
  background: transparent;
}

.age-dialog::backdrop {
  background: rgba(15,8,24,.46);
  backdrop-filter: blur(10px);
}

.age-card {
  margin: 0;
  padding: 32px;
  border: 1px solid rgba(111,25,255,.16);
  border-radius: 28px;
  background: radial-gradient(circle at 82% 0%, rgba(151,75,255,.12), transparent 34%),
              rgba(255,255,255,.98);
  box-shadow: 0 34px 90px rgba(55,12,112,.24), 0 0 42px rgba(111,25,255,.10);
}

.mini-orb {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  margin-bottom: 18px;
  background: radial-gradient(circle, #fff 0 8%, #dabaff 20%, #7e25f8 48%, #281041 72%);
  box-shadow: 0 0 32px rgba(111,25,255,.34);
}

.modal-kicker {
  margin: 0 0 10px;
  color: var(--purple);
  font-size: .68rem;
  letter-spacing: .17em;
  font-weight: 800;
}

.age-card h1 {
  margin: 0;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
}

.age-card > p:not(.modal-kicker) {
  color: var(--muted);
  line-height: 1.7;
}

.modal-actions {
  display: grid;
  gap: 10px;
  margin-top: 22px;
}

/* === CURSOR AURA === */
.cursor-aura {
  position: fixed;
  z-index: 100;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  opacity: 0;
  background: radial-gradient(circle, rgba(142,76,255,.20), rgba(111,25,255,.07) 44%, transparent 72%);
  box-shadow: 0 0 24px rgba(111,25,255,.14);
}

body.cursor-live .cursor-aura { opacity: 1; }

/* === KEYFRAMES === */
@keyframes orbBreath {
  0%, 100% { transform: scale(.95); opacity: .66; }
  50% { transform: scale(1.06); opacity: 1; }
}

@keyframes ringExpand {
  0% { transform: scale(.86); opacity: 0; }
  14% { opacity: .52; }
  100% { transform: scale(1.55); opacity: 0; }
}

@keyframes connectPulse {
  0%, 100% { transform: scale(.95); opacity: .74; filter: brightness(1); }
  50% { transform: scale(1.12); opacity: 1; filter: brightness(1.25); }
}

@keyframes buttonPulse {
  0% { transform: scale(1); opacity: .62; }
  78%, 100% { transform: scale(1.12); opacity: 0; }
}

/* === RESPONSIVE === */
@media (max-width: 760px) {
  .entry-header {
    top: 10px;
    min-height: 60px;
    padding: 7px 8px 7px 12px;
    border-radius: 19px;
  }

  .brand-logo { width: min(150px, 36vw); }

  .button.small {
    min-height: 39px;
    padding: 0 11px;
    font-size: .76rem;
  }

  .entry-page { padding: 84px 10px 20px; }

  .entry-card {
    padding: 16px 10px 24px;
    border-radius: 26px;
  }

  .hero-heading { font-size: clamp(1.5rem, 7vw, 2.2rem); }
  .hero-art { width: 100%; }
  .orb-effects { --orb: clamp(100px, 30vw, 180px); }
  .path-actions { width: min(94%, 460px); }
}

@media (max-width: 480px) {
  .brand-logo { width: 130px; }
  .account-actions { gap: 5px; }

  .button.small {
    padding: 0 9px;
    font-size: .70rem;
  }

  .hero-art { width: 100%; }

  .path-actions {
    grid-template-columns: 1fr;
    width: 92%;
  }

  .path-button {
    min-height: 52px;
  }

  .age-note { font-size: .68rem; }
  .age-card { padding: 26px 21px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="entry-header">
  <img src="/assets/blackvault-horizontal-logo.png" alt="BlackVault" class="brand-logo"/>
  <div class="account-actions">
    <button class="button small glass" type="button">Sign In</button>
    <button class="button small purple" type="button">Sign Up</button>
  </div>
</header>

<!-- Entry Page -->
<main class="entry-page">
  <div class="entry-card">

    <!-- Hero Heading -->
    <h1 class="hero-heading">ENTER BLACKVAULT</h1>
    <p class="powered-line">Powered By Intelligent Design™</p>

    <!-- Hero Stage -->
    <div class="hero-stage" id="heroStage">
      <img
        src="/assets/blackvault-vault-echo-orb-hero.png.png"
        alt="Vault AI and Echo AI presenting the BlackVault Orb"
        class="hero-art"
        fetchpriority="high"
      />

      <!-- Orb Effects (transparent rings only) -->
      <div class="orb-effects">
        <div class="orb-glow"></div>
        <div class="orb-ring ring-one"></div>
        <div class="orb-ring ring-two"></div>
      </div>

      <!-- Connection Status -->
      <div class="connection-status" id="connectionStatus"></div>
    </div>

    <!-- Path Selection -->
    <p class="path-heading">Choose Your Path</p>
    <div class="path-actions">
      <button class="path-button" type="button" id="pathNexus">Nexus Gaming</button>
      <button class="path-button" type="button" id="pathIOE">iOE™ Systems</button>
    </div>

    <p class="age-note"><span>18+</span> Age-restricted entertainment</p>

  </div>
</main>

<!-- Age Dialog -->
<dialog class="age-dialog" id="ageDialog">
  <div class="age-card">
    <div class="mini-orb"></div>
    <p class="modal-kicker">AGE CONFIRMATION</p>
    <h1>Verify Your Age</h1>
    <p>BlackVault includes entertainment experiences intended for adult members. Please confirm that you are 18 years of age or older to continue.</p>
    <div class="modal-actions">
      <button class="button purple" type="button" id="ageConfirm" value="confirm">I Am 18+ — Enter</button>
      <button class="button glass" type="button" id="ageExit">Exit</button>
    </div>
  </div>
</dialog>

<!-- Cursor Aura -->
<div class="cursor-aura"></div>

<script>
(function() {
  var pathNexus = document.getElementById('pathNexus');
  var pathIOE = document.getElementById('pathIOE');
  var status = document.getElementById('connectionStatus');
  var stage = document.getElementById('heroStage');
  var ageDialog = document.getElementById('ageDialog');
  var ageConfirm = document.getElementById('ageConfirm');
  var ageExit = document.getElementById('ageExit');
  var cursorAura = document.querySelector('.cursor-aura');

  var pendingDestination = null;
  var sleep = function(ms) { return new Promise(function(r) { setTimeout(r, ms); }); };

  function checkAgeAndNavigate(destination) {
    var ageVerified = localStorage.getItem('blackvault_age_verified') === 'true';
    if (ageVerified) {
      runConnectionSequence(destination);
      return;
    }
    pendingDestination = destination;
    if (typeof ageDialog.showModal === 'function') {
      ageDialog.showModal();
    }
  }

  async function runConnectionSequence(destination) {
    stage.classList.add('is-connecting');
    status.classList.add('visible');

    var messages = ['SIGNAL DETECTED', 'INITIATING CONNECTION', 'BLACKVAULT ONLINE'];
    for (var i = 0; i < messages.length; i++) {
      status.textContent = messages[i];
      await sleep(900);
    }

    await sleep(400);
    if (destination === 'nexus') {
      window.location.href = '/nexus.html';
    } else {
      window.location.href = '/home.html';
    }
  }

  pathNexus.addEventListener('click', function() {
    checkAgeAndNavigate('nexus');
  });

  pathIOE.addEventListener('click', function() {
    checkAgeAndNavigate('ioe');
  });

  ageConfirm.addEventListener('click', function() {
    localStorage.setItem('blackvault_age_verified', 'true');
    ageDialog.close('confirm');
    if (pendingDestination) {
      runConnectionSequence(pendingDestination);
    }
  });

  ageExit.addEventListener('click', function() {
    ageDialog.close('cancel');
    pendingDestination = null;
  });

  // Cursor aura (pointer devices only)
  if (window.matchMedia('(pointer: fine)').matches) {
    var mx = -100, my = -100, ax = -100, ay = -100;
    document.body.classList.add('cursor-live');
    window.addEventListener('mousemove', function(e) { mx = e.clientX; my = e.clientY; });
    var animate = function() {
      ax += (mx - ax) * 0.15;
      ay += (my - ay) * 0.15;
      cursorAura.style.left = ax + 'px';
      cursorAura.style.top = ay + 'px';
      requestAnimationFrame(animate);
    };
    animate();
  }
})();
</script>
</body>
</html>
