<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BlackVault — Beyond Games. Beyond Reality.</title>
<link rel="icon" type="image/png" href="/assets/blackvault-round-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --purple: #8a2be2;
  --purple-light: #b266ff;
  --purple-glow: rgba(138, 43, 226, 0.5);
  --purple-subtle: rgba(138, 43, 226, 0.12);
  --glass-white: rgba(255, 255, 255, 0.82);
  --glass-border: rgba(255, 255, 255, 0.45);
  --text-primary: #0a0a0a;
  --text-secondary: #4a4a5a;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #ffffff;
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* === HEADER === */
.entry-header {
  position: fixed;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  width: min(92%, 1200px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.5rem;
  border-radius: 100px;
  background: var(--glass-white);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.06), 0 0 40px rgba(138, 43, 226, 0.04);
}

.entry-header-logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.entry-header-logo img {
  width: 32px;
  height: 32px;
}

.entry-header-logo span {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.entry-header-actions {
  display: flex;
  gap: 0.5rem;
}

.btn-signin {
  padding: 0.5rem 1.1rem;
  border-radius: 100px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.2s;
}

.btn-signin:hover {
  color: var(--purple);
}

.btn-signup {
  padding: 0.5rem 1.1rem;
  border-radius: 100px;
  border: 1px solid var(--purple-subtle);
  background: var(--purple-subtle);
  color: var(--purple);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}

.btn-signup:hover {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
}

/* === MAIN ENTRY === */
.entry-main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 6rem 1rem 3rem;
}

/* === SLOGAN === */
.entry-slogan {
  text-align: center;
  margin-bottom: 1.5rem;
  animation: fadeSlideUp 1s ease 0.2s both;
}

.entry-slogan p:first-child {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(0.72rem, 1.4vw, 0.82rem);
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: 0.4rem;
}

.entry-slogan p:last-child {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(0.82rem, 1.6vw, 0.95rem);
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--purple);
}

/* === HERO ARTWORK === */
.entry-hero-wrap {
  position: relative;
  width: clamp(320px, 70vw, 920px);
  margin: 0 auto;
  animation: fadeSlideUp 1.2s ease 0.5s both;
}

.entry-hero-image {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  object-position: center;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  clip-path: none;
  mask: none;
  filter: none;
  transform: none;
}

/* === ORB EFFECTS LAYER === */
.orb-effects {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 30%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2;
}

.orb-glow {
  position: absolute;
  inset: -20%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(138, 43, 226, 0.18) 0%, transparent 70%);
  animation: orbBreathe 3.5s ease-in-out infinite;
}

.orb-ring {
  position: absolute;
  inset: 5%;
  border-radius: 50%;
  border: 1.5px solid rgba(138, 43, 226, 0.3);
  animation: orbRingExpand 4s ease-in-out infinite;
}

.orb-ring-rotate {
  position: absolute;
  inset: -5%;
  border-radius: 50%;
  border: 1px solid transparent;
  border-top-color: rgba(178, 102, 255, 0.4);
  border-right-color: rgba(178, 102, 255, 0.15);
  animation: orbSpin 8s linear infinite;
}

.orb-particles {
  position: absolute;
  inset: -30%;
  border-radius: 50%;
}

.orb-particle {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--purple-light);
  opacity: 0;
  animation: particleFloat 5s ease-in-out infinite;
}

.orb-particle:nth-child(1) { left: 20%; top: 15%; animation-delay: 0s; }
.orb-particle:nth-child(2) { left: 75%; top: 25%; animation-delay: 1s; }
.orb-particle:nth-child(3) { left: 40%; top: 80%; animation-delay: 2s; }
.orb-particle:nth-child(4) { left: 85%; top: 65%; animation-delay: 3s; }
.orb-particle:nth-child(5) { left: 10%; top: 60%; animation-delay: 0.5s; }
.orb-particle:nth-child(6) { left: 60%; top: 10%; animation-delay: 2.5s; }

/* Orb connection active state */
.orb-effects.connecting .orb-glow {
  animation: orbGlowIntense 0.8s ease-in-out infinite;
}

.orb-effects.connecting .orb-ring {
  animation: orbRingPulse 0.6s ease-in-out infinite;
  border-color: rgba(138, 43, 226, 0.7);
}

.orb-effects.connecting .orb-ring-rotate {
  animation: orbSpin 2s linear infinite;
  border-top-color: rgba(178, 102, 255, 0.8);
}

/* === CONNECTION STATUS === */
.orb-status {
  position: absolute;
  left: 50%;
  bottom: -2rem;
  transform: translateX(-50%);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--purple);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

.orb-status.visible {
  opacity: 1;
}

/* === CTA BUTTONS === */
.entry-cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-top: 2.5rem;
  animation: fadeSlideUp 1s ease 0.8s both;
}

.btn-enter {
  position: relative;
  padding: 0.9rem 2rem;
  border-radius: 100px;
  border: none;
  background: var(--purple);
  color: #ffffff;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 0 20px var(--purple-glow), 0 4px 15px rgba(138, 43, 226, 0.3);
  animation: btnPulse 3s ease-in-out infinite;
  transition: transform 0.2s, box-shadow 0.2s;
}

.btn-enter:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 35px var(--purple-glow), 0 8px 25px rgba(138, 43, 226, 0.4);
}

.btn-connect {
  padding: 0.9rem 2rem;
  border-radius: 100px;
  border: 1.5px solid rgba(138, 43, 226, 0.4);
  background: rgba(255, 255, 255, 0.6);
  color: var(--purple);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 12px rgba(138, 43, 226, 0.08);
  transition: all 0.25s;
}

.btn-connect:hover {
  border-color: var(--purple);
  background: rgba(138, 43, 226, 0.06);
  box-shadow: 0 0 20px rgba(138, 43, 226, 0.15);
}

.btn-connect:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* === AGE MODAL === */
.age-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}

.age-modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.age-modal {
  width: min(92%, 440px);
  padding: 2.5rem 2rem;
  border-radius: 1.5rem;
  background: var(--glass-white);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(24px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1), 0 0 60px rgba(138, 43, 226, 0.08);
  text-align: center;
  transform: translateY(20px) scale(0.97);
  transition: transform 0.35s ease;
}

.age-modal-overlay.active .age-modal {
  transform: translateY(0) scale(1);
}

.age-modal h2 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-primary);
  margin-bottom: 1rem;
}

.age-modal p {
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-bottom: 2rem;
}

.age-modal-actions {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.btn-confirm-age {
  padding: 0.9rem 1.5rem;
  border-radius: 100px;
  border: none;
  background: var(--purple);
  color: #ffffff;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 0 20px var(--purple-glow);
  transition: transform 0.2s, box-shadow 0.2s;
}

.btn-confirm-age:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 30px var(--purple-glow);
}

.btn-exit {
  padding: 0.75rem 1.5rem;
  border-radius: 100px;
  border: 1px solid rgba(0, 0, 0, 0.1);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.2s;
}

.btn-exit:hover {
  border-color: rgba(0, 0, 0, 0.3);
}

/* === CURSOR AURA === */
.cursor-aura {
  position: fixed;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(138, 43, 226, 0.35) 0%, transparent 70%);
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: opacity 0.3s;
  opacity: 0;
}

.cursor-aura.visible {
  opacity: 1;
}

/* === KEYFRAMES === */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes orbBreathe {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.92); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
}

@keyframes orbRingExpand {
  0%, 100% { opacity: 0.4; transform: scale(0.95); }
  50% { opacity: 0.8; transform: scale(1.08); }
}

@keyframes orbSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes particleFloat {
  0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
  30% { opacity: 0.7; transform: translateY(-8px) scale(1); }
  70% { opacity: 0.4; transform: translateY(-16px) scale(0.8); }
}

@keyframes orbGlowIntense {
  0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
}

@keyframes orbRingPulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.15); opacity: 1; }
}

@keyframes btnPulse {
  0%, 100% { box-shadow: 0 0 20px var(--purple-glow), 0 4px 15px rgba(138, 43, 226, 0.3); }
  50% { box-shadow: 0 0 30px var(--purple-glow), 0 4px 20px rgba(138, 43, 226, 0.45); }
}

/* === RESPONSIVE === */
@media (max-width: 768px) {
  .entry-header {
    padding: 0.7rem 1rem;
    top: 0.75rem;
    width: 94%;
  }

  .entry-header-logo img {
    width: 28px;
    height: 28px;
  }

  .entry-header-logo span {
    font-size: 0.92rem;
  }

  .entry-main {
    padding: 5.5rem 0.75rem 2rem;
  }

  .entry-hero-wrap {
    width: 95%;
  }

  .entry-slogan p:first-child {
    font-size: 0.65rem;
  }

  .entry-slogan p:last-child {
    font-size: 0.72rem;
  }

  .entry-cta {
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 2rem;
  }

  .btn-enter, .btn-connect {
    width: 100%;
    max-width: 280px;
  }
}

@media (max-width: 430px) {
  .entry-hero-wrap {
    width: 100%;
  }

  .entry-header-logo span {
    font-size: 0.85rem;
  }

  .btn-signin, .btn-signup {
    font-size: 0.78rem;
    padding: 0.45rem 0.85rem;
  }
}

@media (min-width: 1440px) {
  .entry-hero-wrap {
    width: 60vw;
    max-width: 1000px;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="entry-header">
  <div class="entry-header-logo">
    <img src="/assets/blackvault-round-logo.png" alt="BlackVault"/>
    <span>BlackVault</span>
  </div>
  <div class="entry-header-actions">
    <button class="btn-signin" type="button">Sign In</button>
    <button class="btn-signup" type="button">Sign Up</button>
  </div>
</header>

<!-- Main Entry -->
<main class="entry-main">

  <!-- Slogan -->
  <div class="entry-slogan">
    <p>Beyond Games. Beyond Reality.</p>
    <p>This is BlackVault.</p>
  </div>

  <!-- Hero Artwork -->
  <div class="entry-hero-wrap">
    <img
      src="/assets/blackvault-vault-echo-orb-hero.png.png"
      alt="Vault AI and Echo AI presenting the BlackVault Orb"
      class="entry-hero-image"
      fetchpriority="high"
    />

    <!-- Orb Effects Layer -->
    <div class="orb-effects" id="orbEffects">
      <div class="orb-glow"></div>
      <div class="orb-ring"></div>
      <div class="orb-ring-rotate"></div>
      <div class="orb-particles">
        <span class="orb-particle"></span>
        <span class="orb-particle"></span>
        <span class="orb-particle"></span>
        <span class="orb-particle"></span>
        <span class="orb-particle"></span>
        <span class="orb-particle"></span>
      </div>
    </div>

    <!-- Connection Status -->
    <div class="orb-status" id="orbStatus"></div>
  </div>

  <!-- CTA Buttons -->
  <div class="entry-cta">
    <button class="btn-enter" type="button" id="btnEnter">Enter BlackVault</button>
    <button class="btn-connect" type="button" id="btnConnect">Initiate Connection</button>
  </div>

</main>

<!-- Age Confirmation Modal -->
<div class="age-modal-overlay" id="ageModal">
  <div class="age-modal">
    <h2>Age Confirmation</h2>
    <p>BlackVault includes entertainment experiences intended for adult members. Please confirm that you are 18 years of age or older to continue.</p>
    <div class="age-modal-actions">
      <button class="btn-confirm-age" type="button" id="btnConfirmAge">I Am 18+ — Enter BlackVault</button>
      <button class="btn-exit" type="button" id="btnExit">Exit</button>
    </div>
  </div>
</div>

<!-- Cursor Aura (desktop only) -->
<div class="cursor-aura" id="cursorAura"></div>

<script>
(function() {
  // === RETURN VISIT LOGIC ===
  const params = new URLSearchParams(window.location.search);
  const forceEntry = params.has('entry');

  if (!forceEntry && localStorage.getItem('blackvault_age_verified') === 'true') {
    window.location.replace('/home.html');
    return;
  }

  // === DOM REFS ===
  const btnEnter = document.getElementById('btnEnter');
  const btnConnect = document.getElementById('btnConnect');
  const ageModal = document.getElementById('ageModal');
  const btnConfirmAge = document.getElementById('btnConfirmAge');
  const btnExit = document.getElementById('btnExit');
  const orbEffects = document.getElementById('orbEffects');
  const orbStatus = document.getElementById('orbStatus');
  const cursorAura = document.getElementById('cursorAura');

  // === ENTER BLACKVAULT → AGE MODAL ===
  btnEnter.addEventListener('click', function() {
    ageModal.classList.add('active');
  });

  // === AGE CONFIRMATION ===
  btnConfirmAge.addEventListener('click', function() {
    localStorage.setItem('blackvault_age_verified', 'true');
    window.location.href = '/home.html';
  });

  // === EXIT ===
  btnExit.addEventListener('click', function() {
    ageModal.classList.remove('active');
  });

  // Close modal on overlay click
  ageModal.addEventListener('click', function(e) {
    if (e.target === ageModal) {
      ageModal.classList.remove('active');
    }
  });

  // === INITIATE CONNECTION SEQUENCE ===
  let connectionActive = false;

  btnConnect.addEventListener('click', function() {
    if (connectionActive) return;
    connectionActive = true;
    btnConnect.disabled = true;

    orbEffects.classList.add('connecting');

    const steps = [
      { text: 'Signal Detected', delay: 0 },
      { text: 'Connection Established', delay: 1800 },
      { text: 'BlackVault Online', delay: 3400 },
    ];

    steps.forEach(function(step) {
      setTimeout(function() {
        orbStatus.textContent = step.text;
        orbStatus.classList.add('visible');
      }, step.delay);
    });

    setTimeout(function() {
      orbStatus.classList.remove('visible');
      orbEffects.classList.remove('connecting');
      connectionActive = false;
      btnConnect.disabled = false;
    }, 5200);
  });

  // === CURSOR AURA (desktop only) ===
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

  if (!isTouchDevice) {
    let mouseX = 0, mouseY = 0;
    let auraX = 0, auraY = 0;

    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorAura.classList.add('visible');
    });

    document.addEventListener('mouseleave', function() {
      cursorAura.classList.remove('visible');
    });

    function animateAura() {
      auraX += (mouseX - auraX) * 0.15;
      auraY += (mouseY - auraY) * 0.15;
      cursorAura.style.left = auraX + 'px';
      cursorAura.style.top = auraY + 'px';
      requestAnimationFrame(animateAura);
    }
    animateAura();
  }
})();
</script>
</body>
</html>
